name: Deploy Dev

# Opens (or updates) a PR in testkube-deployment after a successful main build.
# Prefer being called from Build and Push (workflow_call). workflow_dispatch is for recovery.
# Uses CI_BOT_TOKEN (same as testkube / testkube-cloud-api) for cross-repo access.

on:
  workflow_call:
    inputs:
      image_tag:
        description: Image tag to bump (e.g. 2.12.0-dev.32)
        required: true
        type: string
      commit_sha:
        description: Initializer commit SHA for the PR body
        required: true
        type: string
      run_number:
        description: Triggering Build and Push run number
        required: false
        type: string
        default: ""
      run_url:
        description: Triggering Build and Push run URL
        required: false
        type: string
        default: ""
  workflow_dispatch:
    inputs:
      image_tag:
        description: Image tag to bump (e.g. 2.12.0-dev.32). Leave empty to use latest successful Build and Push on main.
        required: false
        type: string
      commit_sha:
        description: Initializer commit SHA for the PR body (optional when image_tag is set)
        required: false
        type: string

concurrency:
  # Include run_id so a stuck queued run cannot block recovery dispatches.
  group: deploy-dev-${{ github.ref }}-${{ github.run_id }}
  cancel-in-progress: true

jobs:
  bump-deployment:
    name: Bump deployment
    runs-on: depot-ubuntu-22.04
    permissions:
      contents: read
      actions: read
    steps:
      - name: Resolve build context
        id: ctx
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ inputs.image_tag }}
          INPUT_SHA: ${{ inputs.commit_sha }}
          INPUT_RUN_NUMBER: ${{ inputs.run_number }}
          INPUT_RUN_URL: ${{ inputs.run_url }}
        run: |
          set -euo pipefail

          if [ -n "${INPUT_TAG}" ]; then
            TAG="${INPUT_TAG}"
            SHA="${INPUT_SHA:-${{ github.sha }}}"
            RUN_NUM="${INPUT_RUN_NUMBER:-manual}"
            RUN_URL="${INPUT_RUN_URL:-${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}}"
          else
            RUN_JSON=$(gh api "repos/${{ github.repository }}/actions/workflows/build-push.yaml/runs?branch=main&event=push&status=success&per_page=1")
            RUN_NUM=$(echo "$RUN_JSON" | node -pe 'JSON.parse(require("fs").readFileSync(0,"utf8")).workflow_runs[0].run_number')
            SHA=$(echo "$RUN_JSON" | node -pe 'JSON.parse(require("fs").readFileSync(0,"utf8")).workflow_runs[0].head_sha')
            RUN_URL=$(echo "$RUN_JSON" | node -pe 'JSON.parse(require("fs").readFileSync(0,"utf8")).workflow_runs[0].html_url')
            gh api "repos/${{ github.repository }}/contents/package.json?ref=${SHA}" --jq .content | base64 -d > /tmp/pkg.json
            VERSION=$(node -pe 'JSON.parse(require("fs").readFileSync("/tmp/pkg.json","utf8")).version')
            TAG="${VERSION}-dev.${RUN_NUM}"
          fi

          {
            echo "value=${TAG}"
            echo "sha=${SHA}"
            echo "run_number=${RUN_NUM}"
            echo "run_url=${RUN_URL}"
          } >> "$GITHUB_OUTPUT"
          echo "Image tag: ${TAG} (sha=${SHA})"

      - name: Verify access to testkube-deployment
        id: auth
        env:
          CI_BOT_TOKEN: ${{ secrets.CI_BOT_TOKEN }}
          PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          pick_token() {
            for NAME in CI_BOT_TOKEN PAT_TOKEN; do
              eval "T=\${${NAME}}"
              [ -z "${T}" ] && continue
              HTTP=$(curl -s -o /dev/null -w "%{http_code}" \
                -H "Authorization: Bearer ${T}" \
                -H "Accept: application/vnd.github+json" \
                "https://api.github.com/repos/kubeshop/testkube-deployment")
              if [ "${HTTP}" = "200" ]; then
                echo "source=${NAME}" >> "$GITHUB_OUTPUT"
                return 0
              fi
              echo "::warning::${NAME} cannot read kubeshop/testkube-deployment (HTTP ${HTTP})"
            done
            echo "::error::No token can access kubeshop/testkube-deployment."
            echo "Configure CI_BOT_TOKEN (preferred, same as kubeshop/testkube) or grant PAT_TOKEN access to the private repo + kubeshop SSO."
            exit 1
          }
          pick_token

      - name: Checkout testkube-deployment
        uses: actions/checkout@v4
        with:
          repository: kubeshop/testkube-deployment
          token: ${{ secrets.CI_BOT_TOKEN || secrets.PAT_TOKEN }}
          path: testkube-deployment

      - name: Configure Git
        working-directory: testkube-deployment
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"

      - name: Bump initializer image
        working-directory: testkube-deployment
        env:
          TAG: ${{ steps.ctx.outputs.value }}
        run: |
          KUSTOMIZE=envs/dev/initializer/kustomize/kustomization.yaml
          DEPLOY=envs/dev/initializer/kustomize/base/deployment.yaml

          if [ ! -f "$KUSTOMIZE" ] || [ ! -f "$DEPLOY" ]; then
            echo "Initializer kustomize paths not found in testkube-deployment"
            exit 1
          fi

          sed -i "s/newTag: .*/newTag: ${TAG}/" "$KUSTOMIZE"
          sed -i "s|image: kubeshop/testkube-initializer:.*|image: kubeshop/testkube-initializer:${TAG}|" "$DEPLOY"

      - name: Create deployment pull request
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.CI_BOT_TOKEN || secrets.PAT_TOKEN }}
          path: testkube-deployment
          commit-message: "chore(dev): bump testkube-initializer to ${{ steps.ctx.outputs.value }}"
          title: "chore(dev): bump testkube-initializer to ${{ steps.ctx.outputs.value }}"
          body: |
            Automated image bump from [testkube-initializer workflow run ${{ steps.ctx.outputs.run_number }}](${{ steps.ctx.outputs.run_url }}).

            - **Image:** `kubeshop/testkube-initializer:${{ steps.ctx.outputs.value }}`
            - **Commit:** `${{ steps.ctx.outputs.sha }}`
          branch: bump/testkube-initializer-${{ steps.ctx.outputs.value }}
          delete-branch: true
          labels: |
            automated
            testkube-initializer
            dev

      - name: Summary
        if: always()
        run: |
          {
            echo "### Dev deployment PR"
            echo ""
            echo "- **Image tag:** \`${{ steps.ctx.outputs.value }}\`"
            echo "- **Trigger:** [${{ steps.ctx.outputs.run_number }}](${{ steps.ctx.outputs.run_url }})"
          } >> "$GITHUB_STEP_SUMMARY"
