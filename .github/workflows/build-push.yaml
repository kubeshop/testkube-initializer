name: Build and Push

on:
  push:
    branches:
      - main
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build only, do not push to Docker Hub
        required: false
        type: boolean
        default: false

concurrency:
  group: build-push-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: kubeshop/testkube-initializer

jobs:
  build:
    name: Build image
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read package version
        id: pkg
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker Hub login
        if: github.event_name != 'pull_request' && (github.event_name != 'workflow_dispatch' || inputs.dry_run != true)
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}},event=tag
            type=raw,value=${{ steps.pkg.outputs.version }}-dev.${{ github.run_number }},enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,prefix=${{ steps.pkg.outputs.version }}-dev.,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=${{ steps.pkg.outputs.version }}-pr.${{ github.event.pull_request.number }},enable=${{ github.event_name == 'pull_request' }}
            type=raw,value=${{ steps.pkg.outputs.version }}-manual.${{ github.run_number }},enable=${{ github.event_name == 'workflow_dispatch' }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name != 'pull_request' && (github.event_name != 'workflow_dispatch' || inputs.dry_run != true) }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        if: always()
        run: |
          {
            echo "### Docker image"
            echo ""
            echo "- **Repository:** \`${{ env.IMAGE }}\`"
            echo "- **Package version:** \`${{ steps.pkg.outputs.version }}\`"
            echo "- **Tags:**"
            echo '${{ steps.meta.outputs.tags }}' | sed 's/^/- `/' | sed 's/$/`/'
            echo "- **Push:** ${{ github.event_name != 'pull_request' && (github.event_name != 'workflow_dispatch' || inputs.dry_run != true) }}"
          } >> "$GITHUB_STEP_SUMMARY"
