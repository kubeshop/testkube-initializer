name: Build and Push

on:
  push:
    branches:
      - main
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build only, do not push to Docker Hub
        required: false
        type: boolean
        default: false

concurrency:
  group: build-push-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: kubeshop/testkube-initializer

jobs:
  build:
    name: Build image
    # Job runs on GitHub-hosted; docker build itself uses Depot builders via OIDC.
    # (Depot Actions runners are not yet provisioning for this repo.)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # needed for depot
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read package version
        id: pkg
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Set up Depot CLI
        uses: depot/setup-action@15c09a5f77a0840ad4bce955686522a257853461 # v1.7.1

      - name: Docker Hub login
        if: github.event_name != 'pull_request' && (github.event_name != 'workflow_dispatch' || inputs.dry_run != true)
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          bake-target: initializer-meta
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}},event=tag
            type=raw,value=${{ steps.pkg.outputs.version }}-dev.${{ github.run_number }},enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,prefix=${{ steps.pkg.outputs.version }}-dev.,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=${{ steps.pkg.outputs.version }}-pr.${{ github.event.pull_request.number }},enable=${{ github.event_name == 'pull_request' }}
            type=raw,value=${{ steps.pkg.outputs.version }}-manual.${{ github.run_number }},enable=${{ github.event_name == 'workflow_dispatch' }}

      - name: Build and push
        uses: depot/bake-action@1d58c2668346981089b088b7ef36755b206b20e9 # v1.13.0
        with:
          files: |
            ./docker-bake.hcl
            ${{ steps.meta.outputs.bake-file }}
          targets: initializer
          push: ${{ github.event_name != 'pull_request' && (github.event_name != 'workflow_dispatch' || inputs.dry_run != true) }}
        env:
          VITE_POSTHOG_KEY: ${{ secrets.VITE_POSTHOG_KEY }}
          VITE_POSTHOG_HOST: ${{ secrets.VITE_POSTHOG_HOST }}

      - name: Summary
        if: always()
        run: |
          {
            echo "### Docker image"
            echo ""
            echo "- **Repository:** \`${{ env.IMAGE }}\`"
            echo "- **Package version:** \`${{ steps.pkg.outputs.version }}\`"
            echo "- **Depot project:** \`b25sttgrjl\`"
            echo "- **Tags:**"
            echo '${{ steps.meta.outputs.tags }}' | sed 's/^/- `/' | sed 's/$/`/'
            echo "- **Push:** ${{ github.event_name != 'pull_request' && (github.event_name != 'workflow_dispatch' || inputs.dry_run != true) }}"
          } >> "$GITHUB_STEP_SUMMARY"
